<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>brain-log</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
    }

    .header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header .logo { font-size: 18px; }
    .header h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
    .header .status { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: #555; }
    .header .status.ok { background: #4ade80; }
    .header .status.err { background: #f87171; }

    .tabs {
      display: flex;
      border-bottom: 1px solid #222;
    }

    .tab {
      flex: 1;
      padding: 8px 4px;
      text-align: center;
      font-size: 11px;
      cursor: pointer;
      color: #666;
      border: none;
      background: none;
      transition: color 0.15s;
    }

    .tab:hover { color: #aaa; }
    .tab.active { color: #e8e8e8; border-bottom: 2px solid #a78bfa; }

    .body { padding: 14px 16px; }

    textarea {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #e8e8e8;
      font-size: 13px;
      padding: 10px;
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus { border-color: #a78bfa; }
    textarea::placeholder { color: #444; }

    .selected-text {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      color: #888;
      margin-bottom: 10px;
      max-height: 60px;
      overflow-y: auto;
      display: none;
    }

    .selected-text.visible { display: block; }
    .selected-text span { color: #a78bfa; font-size: 10px; display: block; margin-bottom: 4px; }

    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 9px;
      background: #a78bfa;
      color: #0f0f0f;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: #c4b5fd; }
    .btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    .toast {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }

    .toast.success { display: block; background: #14532d; color: #4ade80; }
    .toast.error { display: block; background: #450a0a; color: #f87171; }

    .settings { padding: 14px 16px; }
    .settings label { font-size: 11px; color: #666; display: block; margin-bottom: 4px; margin-top: 12px; }
    .settings label:first-child { margin-top: 0; }
    .settings input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #e8e8e8;
      font-size: 12px;
      padding: 8px 10px;
      outline: none;
      font-family: monospace;
    }
    .settings input:focus { border-color: #a78bfa; }
    .save-btn {
      margin-top: 14px;
      width: 100%;
      padding: 8px;
      background: #222;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .save-btn:hover { background: #2a2a2a; color: #e8e8e8; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🧠</span>
    <h1>brain-log</h1>
    <div class="status" id="status"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="capture">Capturar</button>
    <button class="tab" data-tab="settings">Config</button>
  </div>

  <!-- JIRA DETECTED BANNER -->
  <div id="jira-banner" style="display:none; padding:10px 16px; background:#1a1a2e; border-bottom:1px solid #2a2a4a;">
    <div style="font-size:11px; color:#a78bfa; margin-bottom:6px;">🎯 Jira detectado</div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span id="jira-issue-key" style="font-size:12px; font-weight:600; color:#e8e8e8; font-family:monospace;"></span>
      <span id="jira-issue-title" style="font-size:11px; color:#888; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
    </div>
    <button id="add-task-btn" style="margin-top:8px; width:100%; padding:6px; background:#1e1b4b; color:#a78bfa; border:1px solid #a78bfa; border-radius:6px; font-size:11px; cursor:pointer;">
      + Agregar a Tasks en Notion
    </button>
    <div id="jira-toast" style="font-size:11px; margin-top:6px; display:none;"></div>
  </div>

  <!-- CAPTURE TAB -->
  <div id="tab-capture" class="body">
    <div class="selected-text" id="selected-preview">
      <span>Texto seleccionado</span>
      <div id="selected-content"></div>
    </div>

    <select id="type-select" style="width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;color:#e8e8e8;padding:8px 10px;font-size:13px;margin-bottom:10px;outline:none;">
      <option value="note">📝 Note</option>
      <option value="todo">☑️ Todo</option>
      <option value="vibe">⚡ Vibe</option>
      <option value="learn">🧠 Learn</option>
    </select>

    <textarea id="raw-input" placeholder="¿Qué quieres capturar?"></textarea>

    <button class="btn" id="save-btn">Guardar en Notion</button>
    <div class="toast" id="toast"></div>
  </div>

  <!-- SETTINGS TAB -->
  <div id="tab-settings" class="settings" style="display:none">
    <label>API URL</label>
    <input type="text" id="api-url" placeholder="https://xxxx.ngrok.io" />
    <label>API Secret</label>
    <input type="password" id="api-secret" placeholder="brain-log-secret" />
    <button class="save-btn" id="save-settings">Guardar configuración</button>
    <div class="toast" id="settings-toast"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
